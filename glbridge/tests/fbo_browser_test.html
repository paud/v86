<!doctype html>
<meta charset="utf-8">
<title>OpenGL FBO browser test: running</title>
<canvas id="v86gl_canvas" width="64" height="64"></canvas>
<pre id="result">running</pre>
<script src="../libglwasm/gl4es.js?v=webgl-clean-v1-20260801"></script>
<script>
(async () => {
    "use strict";

    const GL_FRAMEBUFFER = 0x8D40;
    const GL_RENDERBUFFER = 0x8D41;
    const GL_COLOR_ATTACHMENT0 = 0x8CE0;
    const GL_NONE = 0;
    const GL_DEPTH_ATTACHMENT = 0x8D00;
    const GL_STENCIL_ATTACHMENT = 0x8D20;
    const GL_FRAMEBUFFER_COMPLETE = 0x8CD5;
    const GL_FRAMEBUFFER_INCOMPLETE_ATTACHMENT = 0x8CD6;
    const GL_TEXTURE_2D = 0x0DE1;
    const GL_TEXTURE_MIN_FILTER = 0x2801;
    const GL_TEXTURE_MAG_FILTER = 0x2800;
    const GL_NEAREST = 0x2600;
    const GL_TRIANGLES = 0x0004;
    const GL_TRIANGLE_STRIP = 0x0005;
    const GL_FLOAT = 0x1406;
    const GL_VERTEX_SHADER = 0x8B31;
    const GL_FRAGMENT_SHADER = 0x8B30;
    const GL_COMPILE_STATUS = 0x8B81;
    const GL_LINK_STATUS = 0x8B82;
    const GL_RGBA8 = 0x8058;
    const GL_RGB8 = 0x8051;
    const GL_RGBA4 = 0x8056;
    const GL_RGB5_A1 = 0x8057;
    const GL_RGB565 = 0x8D62;
    const GL_RGB10 = 0x8052;
    const GL_RGBA16 = 0x805B;
    const GL_SRGB8_ALPHA8 = 0x8C43;
    const GL_DEPTH24_STENCIL8 = 0x88F0;
    const GL_MAX_RENDERBUFFER_SIZE = 0x84E8;
    const GL_COLOR_BUFFER_BIT = 0x4000;
    const GL_DEPTH_BUFFER_BIT = 0x0100;
    const GL_STENCIL_BUFFER_BIT = 0x0400;
    const GL_RGB = 0x1907;
    const GL_RGBA = 0x1908;
    const GL_BGRA = 0x80E1;
    const GL_UNSIGNED_BYTE = 0x1401;
    const GL_UNSIGNED_SHORT_4_4_4_4 = 0x8033;
    const GL_UNSIGNED_SHORT_5_5_5_1 = 0x8034;
    const GL_UNSIGNED_SHORT_5_6_5 = 0x8363;
    const GL_UNSIGNED_SHORT_5_6_5_REV = 0x8364;
    const GL_UNSIGNED_SHORT_4_4_4_4_REV = 0x8365;
    const GL_UNSIGNED_SHORT_1_5_5_5_REV = 0x8366;
    const GL_UNSIGNED_INT_8_8_8_8_REV = 0x8367;
    const GL_PACK_ALIGNMENT = 0x0D05;
    const GL_PACK_ROW_LENGTH = 0x0D02;
    const GL_PACK_SKIP_ROWS = 0x0D03;
    const GL_PACK_SKIP_PIXELS = 0x0D04;
    const GL_TEXTURE0 = 0x84C0;
    const OBJECT_SHADER = 1;
    const OBJECT_PROGRAM = 2;
    const encoder = new TextEncoder();
    const module = await createV86GL4ES({
        canvas: document.getElementById("v86gl_canvas"),
        locateFile(path) {
            return `../libglwasm/${path}?v=webgl-clean-v1-20260801`;
        },
    });

    function namePtr(name) {
        const ptr = module._malloc(4);
        new DataView(module.HEAPU8.buffer).setUint32(ptr, name, true);
        return ptr;
    }

    function errorHex() {
        return `0x${module._v86gl_glQueryError().toString(16)}`;
    }

    function assertNoError(label) {
        const error = module._v86gl_glQueryError();
        if (error) throw new Error(`${label}: 0x${error.toString(16)}`);
    }

    function readPacked16(label, format, type) {
        const ptr = module._malloc(2);
        module.HEAPU8.fill(0xA5, ptr, ptr + 2);
        if (!module._v86gl_glReadPixels(32, 32, 1, 1, format, type, ptr)) {
            throw new Error(`${label} readback failed`);
        }
        assertNoError(label);
        return new DataView(module.HEAPU8.buffer).getUint16(ptr, true);
    }

    function assertPackedColor(label, channels, maxima) {
        const expected = [1, 0.25, 0.1, 1];
        for (let channel = 0; channel < 4; channel++) {
            const actual = channels[channel] / maxima[channel];
            if (Math.abs(actual - expected[channel]) > 0.08) {
                throw new Error(`${label} mismatch ` +
                    `${channels.join(",")}/${maxima.join(",")}`);
            }
        }
    }

    function allocText(text) {
        const bytes = encoder.encode(text);
        const ptr = module._malloc(Math.max(bytes.length, 1));
        module.HEAPU8.set(bytes, ptr);
        return {ptr, length: bytes.length};
    }

    function queryObject(kind, name, pname) {
        const ptr = module._malloc(4);
        if (!module._v86gl_glQueryObjectivMapped(kind, name, pname, ptr)) {
            throw new Error(`object query ${name}/0x${pname.toString(16)} failed`);
        }
        return new DataView(module.HEAPU8.buffer).getInt32(ptr, true);
    }

    function objectLog(kind, name) {
        const lengthPtr = module._malloc(4);
        const logPtr = module._malloc(2048);
        if (!module._v86gl_glQueryObjectLogMapped(
                kind, name, 2048, lengthPtr, logPtr)) {
            return "<log query failed>";
        }
        const length = new DataView(module.HEAPU8.buffer)
            .getInt32(lengthPtr, true);
        return new TextDecoder().decode(
            module.HEAPU8.subarray(logPtr, logPtr + Math.max(length, 0)))
            .replace(/\0/g, "");
    }

    function compileShader(name, type, source) {
        const encoded = allocText(source);
        module._v86gl_glCreateShaderMapped(name, type);
        module._v86gl_glShaderSourceMapped(name, encoded.length, encoded.ptr);
        module._v86gl_glCompileShaderMapped(name);
        if (!queryObject(OBJECT_SHADER, name, GL_COMPILE_STATUS)) {
            throw new Error(`shader ${name} did not compile: ` +
                objectLog(OBJECT_SHADER, name));
        }
    }

    module._v86glMakeCurrent(1, 0, 0, 64, 64);
    while (module._v86gl_glQueryError()) {}

    const limitPtr = module._malloc(4);
    if (!module._v86gl_glQueryInteger(GL_MAX_RENDERBUFFER_SIZE, limitPtr)) {
        throw new Error("renderbuffer limit query failed");
    }
    const maxRenderbufferSize = new DataView(module.HEAPU8.buffer).getInt32(limitPtr, true);
    if (maxRenderbufferSize < 64) throw new Error(`bad renderbuffer limit ${maxRenderbufferSize}`);
    assertNoError("renderbuffer limit");

    module._v86gl_glGenFramebuffersMapped(1, namePtr(41));
    assertNoError("gen framebuffer");
    module._v86gl_glGenRenderbuffersMapped(1, namePtr(51));
    assertNoError("gen color renderbuffer");
    module._v86gl_glGenRenderbuffersMapped(1, namePtr(52));
    assertNoError("gen depth renderbuffer");
    module._v86gl_glBindFramebufferMapped(GL_FRAMEBUFFER, 41);
    assertNoError("bind framebuffer");
    module._v86gl_glBindRenderbufferMapped(GL_RENDERBUFFER, 51);
    assertNoError("bind color renderbuffer");
    const colorFormats = [
        GL_RGBA8, GL_RGB8, GL_RGBA4, GL_RGB5_A1, GL_RGB565,
        GL_RGB10, GL_RGBA16, GL_SRGB8_ALPHA8,
    ];
    for (let formatIndex = 0; formatIndex < colorFormats.length; formatIndex++) {
        const format = colorFormats[formatIndex];
        module._v86gl_glRenderbufferStorageMapped(GL_RENDERBUFFER, format, 64, 64);
        const error = module._v86gl_glQueryError();
        if (error) throw new Error(`renderbuffer format 0x${format.toString(16)}: 0x${error.toString(16)}`);
        if (!formatIndex) {
            module._v86gl_glFramebufferRenderbufferMapped(
                GL_FRAMEBUFFER, GL_COLOR_ATTACHMENT0, GL_RENDERBUFFER, 51);
            assertNoError("attach color renderbuffer");
        }
        const status = module._v86gl_glCheckFramebufferStatusMapped(GL_FRAMEBUFFER);
        if (status !== GL_FRAMEBUFFER_COMPLETE) {
            throw new Error(`format 0x${format.toString(16)} status 0x${status.toString(16)}`);
        }
    }

    module._v86gl_glBindRenderbufferMapped(GL_RENDERBUFFER, 52);
    module._v86gl_glRenderbufferStorageMapped(
        GL_RENDERBUFFER, GL_DEPTH24_STENCIL8, 64, 64);
    module._v86gl_glFramebufferRenderbufferMapped(
        GL_FRAMEBUFFER, GL_DEPTH_ATTACHMENT, GL_RENDERBUFFER, 52);
    module._v86gl_glFramebufferRenderbufferMapped(
        GL_FRAMEBUFFER, GL_STENCIL_ATTACHMENT, GL_RENDERBUFFER, 52);
    if (module._v86gl_glQueryError()) {
        throw new Error(`packed depth/stencil setup failed: ${errorHex()}`);
    }
    const packedStatus = module._v86gl_glCheckFramebufferStatusMapped(GL_FRAMEBUFFER);
    if (packedStatus !== GL_FRAMEBUFFER_COMPLETE) {
        throw new Error(`packed FBO status 0x${packedStatus.toString(16)}`);
    }

    module._v86gl_glViewport(0, 0, 64, 64);
    module._v86gl_glClearColor(0.8, 0.15, 0.65, 1);
    module._v86gl_glClear(GL_COLOR_BUFFER_BIT | GL_DEPTH_BUFFER_BIT | GL_STENCIL_BUFFER_BIT);
    module._v86gl_glFinish();
    const pixelPtr = module._malloc(4);
    if (!module._v86gl_glReadPixels(
            32, 32, 1, 1, GL_RGBA, GL_UNSIGNED_BYTE, pixelPtr)) {
        throw new Error("FBO readback failed");
    }
    const pixel = Array.from(module.HEAPU8.subarray(pixelPtr, pixelPtr + 4));
    if (pixel[0] < 150 || pixel[2] < 120 || pixel[3] < 240) {
        throw new Error(`FBO pixel mismatch ${pixel.join(",")}`);
    }

    /* Desktop GL permits attaching a bound texture before defining level 0;
     * the FBO is incomplete until TexImage, but the attach itself is legal.
     * gl4es defers the underlying 2D bind, so this specifically verifies that
     * the raw WebGL FBO bridge initializes the object's target and restores
     * the physical binding expected by gl4es. */
    module._v86gl_glGenTextures(1, namePtr(62));
    module._v86gl_glBindTexture(GL_TEXTURE_2D, 62);
    const rawGl = document.getElementById("v86gl_canvas").getContext("webgl2");
    const rawBindingBeforeAttach = rawGl &&
        rawGl.getParameter(rawGl.TEXTURE_BINDING_2D);
    module._v86gl_glGenFramebuffersMapped(1, namePtr(43));
    module._v86gl_glBindFramebufferMapped(GL_FRAMEBUFFER, 43);
    module._v86gl_glFramebufferTextureMapped(
        GL_FRAMEBUFFER, GL_COLOR_ATTACHMENT0, GL_TEXTURE_2D, 62, 0, 0);
    assertNoError("attach texture before image");
    if (rawGl && rawGl.getParameter(rawGl.TEXTURE_BINDING_2D) !==
            rawBindingBeforeAttach) {
        throw new Error("raw texture binding changed during target initialization");
    }
    const undefinedTextureStatus =
        module._v86gl_glCheckFramebufferStatusMapped(GL_FRAMEBUFFER);
    if (undefinedTextureStatus !== GL_FRAMEBUFFER_INCOMPLETE_ATTACHMENT) {
        throw new Error(`undefined texture FBO status ` +
            `0x${undefinedTextureStatus.toString(16)}`);
    }
    module._v86gl_glTexImage2D(
        GL_TEXTURE_2D, 0, GL_RGBA8, 16, 16, 0,
        GL_RGBA, GL_UNSIGNED_BYTE, 0);
    assertNoError("allocate texture after attachment");
    const lateImageStatus =
        module._v86gl_glCheckFramebufferStatusMapped(GL_FRAMEBUFFER);
    if (lateImageStatus !== GL_FRAMEBUFFER_COMPLETE) {
        throw new Error(`late-image FBO status 0x${lateImageStatus.toString(16)}`);
    }
    module._v86gl_glFramebufferTextureMapped(
        GL_FRAMEBUFFER, GL_COLOR_ATTACHMENT0, GL_TEXTURE_2D, 0, 0, 0);
    module._v86gl_glBindFramebufferMapped(GL_FRAMEBUFFER, 41);
    module._v86gl_glDeleteFramebuffersMapped(1, namePtr(43));
    module._v86gl_glDeleteTextures(1, namePtr(62));
    assertNoError("attach-before-image cleanup");

    /* WineD3D 1.7.52 probes the D3D8 X8R8G8B8 backbuffer with this exact
     * desktop tuple. WebGL2 does not accept BGRA / 8_8_8_8_REV directly, so
     * keep this separate from the ordinary RGBA8 regression above. */
    module._v86gl_glGenTextures(1, namePtr(63));
    module._v86gl_glBindTexture(GL_TEXTURE_2D, 63);
    module._v86gl_glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MIN_FILTER, GL_NEAREST);
    module._v86gl_glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MAG_FILTER, GL_NEAREST);
    module._v86gl_glTexImage2D(
        GL_TEXTURE_2D, 0, GL_RGB8, 16, 16, 0,
        GL_BGRA, GL_UNSIGNED_INT_8_8_8_8_REV, 0);
    assertNoError("WineD3D X8R8G8B8 texture allocation");
    module._v86gl_glGenFramebuffersMapped(1, namePtr(44));
    module._v86gl_glBindFramebufferMapped(GL_FRAMEBUFFER, 44);
    module._v86gl_glFramebufferTextureMapped(
        GL_FRAMEBUFFER, GL_COLOR_ATTACHMENT0, GL_TEXTURE_2D, 63, 0, 0);
    assertNoError("attach WineD3D X8R8G8B8 texture");
    const x8r8g8b8Status =
        module._v86gl_glCheckFramebufferStatusMapped(GL_FRAMEBUFFER);
    if (x8r8g8b8Status !== GL_FRAMEBUFFER_COMPLETE) {
        throw new Error(`WineD3D X8R8G8B8 FBO status ` +
            `0x${x8r8g8b8Status.toString(16)}`);
    }
    module._v86gl_glBindFramebufferMapped(GL_FRAMEBUFFER, 41);
    module._v86gl_glDeleteFramebuffersMapped(1, namePtr(44));
    module._v86gl_glDeleteTextures(1, namePtr(63));
    assertNoError("WineD3D X8R8G8B8 cleanup");

    /* WineD3D 1.7.52 probes renderable formats with texture-backed FBOs and
     * leaves the attachment texture bound while drawing its verification
     * quad.  WebGL must not treat a disabled fixed-function texture target as
     * an active sampler, otherwise the draw is rejected as a feedback loop. */
    module._v86gl_glGenTextures(1, namePtr(61));
    module._v86gl_glBindTexture(GL_TEXTURE_2D, 61);
    module._v86gl_glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MIN_FILTER, GL_NEAREST);
    module._v86gl_glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MAG_FILTER, GL_NEAREST);
    module._v86gl_glTexImage2D(
        GL_TEXTURE_2D, 0, GL_RGBA8, 64, 64, 0,
        GL_RGBA, GL_UNSIGNED_BYTE, 0);
    assertNoError("texture allocation");

    module._v86gl_glGenFramebuffersMapped(1, namePtr(42));
    module._v86gl_glBindFramebufferMapped(GL_FRAMEBUFFER, 42);
    module._v86gl_glFramebufferTextureMapped(
        GL_FRAMEBUFFER, GL_COLOR_ATTACHMENT0, GL_TEXTURE_2D, 61, 0, 0);
    assertNoError("attach color texture");
    const textureStatus = module._v86gl_glCheckFramebufferStatusMapped(GL_FRAMEBUFFER);
    if (textureStatus !== GL_FRAMEBUFFER_COMPLETE) {
        throw new Error(`texture FBO status 0x${textureStatus.toString(16)}`);
    }

    /* WineD3D initializes a newly applied FBO with glDrawBuffer(GL_NONE),
     * then enables its render target through glDrawBuffers().  Exercise that
     * exact single-selector -> multi-selector transition before drawing. */
    module._v86gl_glDrawBuffer(GL_NONE);
    const drawBufferPtr = module._malloc(4);
    new DataView(module.HEAPU8.buffer)
        .setUint32(drawBufferPtr, GL_COLOR_ATTACHMENT0, true);
    module._v86gl_glDrawBuffers(1, drawBufferPtr);
    if (rawGl && rawGl.getParameter(rawGl.DRAW_BUFFER0) !==
            GL_COLOR_ATTACHMENT0) {
        throw new Error("WineD3D draw buffer transition remained GL_NONE");
    }
    assertNoError("WineD3D draw buffer transition");

    module._v86gl_glDisable(GL_TEXTURE_2D);
    module._v86gl_glViewport(0, 0, 64, 64);
    module._v86gl_glClearColor(0, 0, 0, 1);
    module._v86gl_glClear(GL_COLOR_BUFFER_BIT);
    module._v86gl_glColor4f(1, 0.25, 0.1, 1);
    module._v86gl_glBegin(GL_TRIANGLES);
    module._v86gl_glVertex3f(-1, -1, 0);
    module._v86gl_glVertex3f(1, -1, 0);
    module._v86gl_glVertex3f(0, 1, 0);
    module._v86gl_glEnd();
    module._v86gl_glFinish();
    assertNoError("texture FBO draw");

    const texturePixelPtr = module._malloc(4);
    if (!module._v86gl_glReadPixels(
            32, 32, 1, 1, GL_RGBA, GL_UNSIGNED_BYTE, texturePixelPtr)) {
        throw new Error("texture FBO readback failed");
    }
    const texturePixel = Array.from(
        module.HEAPU8.subarray(texturePixelPtr, texturePixelPtr + 4));
    if (texturePixel[0] < 240 || texturePixel[1] < 45 ||
            texturePixel[1] > 85 || texturePixel[2] < 15 ||
            texturePixel[2] > 45 || texturePixel[3] < 240) {
        throw new Error(`texture FBO pixel mismatch ${texturePixel.join(",")}`);
    }

    const bgraPixelPtr = module._malloc(4);
    if (!module._v86gl_glReadPixels(
            32, 32, 1, 1, GL_BGRA,
            GL_UNSIGNED_INT_8_8_8_8_REV, bgraPixelPtr)) {
        throw new Error("WineD3D BGRA packed readback failed");
    }
    const bgraPixel = Array.from(
        module.HEAPU8.subarray(bgraPixelPtr, bgraPixelPtr + 4));
    if (bgraPixel[0] < 15 || bgraPixel[0] > 45 ||
            bgraPixel[1] < 45 || bgraPixel[1] > 85 ||
            bgraPixel[2] < 240 || bgraPixel[3] < 240) {
        throw new Error(`BGRA packed pixel mismatch ${bgraPixel.join(",")}`);
    }

    /* WebGL rejects these desktop packed readPixels tuples. The bridge must
     * always read native RGBA/UNSIGNED_BYTE and reproduce their exact little-
     * endian field ordering in Wasm for WineD3D's format probes. */
    const rgb565 = readPacked16(
        "RGB/565", GL_RGB, GL_UNSIGNED_SHORT_5_6_5);
    assertPackedColor("RGB/565", [
        (rgb565 >> 11) & 0x1f,
        (rgb565 >> 5) & 0x3f,
        rgb565 & 0x1f,
        1,
    ], [31, 63, 31, 1]);

    const rgb565Rev = readPacked16(
        "RGB/565_REV", GL_RGB, GL_UNSIGNED_SHORT_5_6_5_REV);
    assertPackedColor("RGB/565_REV", [
        rgb565Rev & 0x1f,
        (rgb565Rev >> 5) & 0x3f,
        (rgb565Rev >> 11) & 0x1f,
        1,
    ], [31, 63, 31, 1]);

    const rgba4444 = readPacked16(
        "RGBA/4444", GL_RGBA, GL_UNSIGNED_SHORT_4_4_4_4);
    assertPackedColor("RGBA/4444", [
        (rgba4444 >> 12) & 0x0f,
        (rgba4444 >> 8) & 0x0f,
        (rgba4444 >> 4) & 0x0f,
        rgba4444 & 0x0f,
    ], [15, 15, 15, 15]);

    const rgba4444Rev = readPacked16(
        "RGBA/4444_REV", GL_RGBA, GL_UNSIGNED_SHORT_4_4_4_4_REV);
    assertPackedColor("RGBA/4444_REV", [
        rgba4444Rev & 0x0f,
        (rgba4444Rev >> 4) & 0x0f,
        (rgba4444Rev >> 8) & 0x0f,
        (rgba4444Rev >> 12) & 0x0f,
    ], [15, 15, 15, 15]);

    const rgba5551 = readPacked16(
        "RGBA/5551", GL_RGBA, GL_UNSIGNED_SHORT_5_5_5_1);
    assertPackedColor("RGBA/5551", [
        (rgba5551 >> 11) & 0x1f,
        (rgba5551 >> 6) & 0x1f,
        (rgba5551 >> 1) & 0x1f,
        rgba5551 & 0x01,
    ], [31, 31, 31, 1]);

    const bgra1555Rev = readPacked16(
        "BGRA/1555_REV", GL_BGRA, GL_UNSIGNED_SHORT_1_5_5_5_REV);
    assertPackedColor("BGRA/1555_REV", [
        (bgra1555Rev >> 10) & 0x1f,
        (bgra1555Rev >> 5) & 0x1f,
        bgra1555Rev & 0x1f,
        (bgra1555Rev >> 15) & 0x01,
    ], [31, 31, 31, 1]);

    /* Packed readback must preserve skipped bytes and row padding. The guest
     * proxy seeds these bytes into the PCI response before the host writes the
     * actual pixel, so exercise the host half with the same sentinel layout. */
    module._v86gl_glPixelStorei(GL_PACK_ALIGNMENT, 4);
    module._v86gl_glPixelStorei(GL_PACK_ROW_LENGTH, 3);
    module._v86gl_glPixelStorei(GL_PACK_SKIP_ROWS, 1);
    module._v86gl_glPixelStorei(GL_PACK_SKIP_PIXELS, 1);
    const packedBgraPtr = module._malloc(32);
    module.HEAPU8.fill(0xA5, packedBgraPtr, packedBgraPtr + 32);
    if (!module._v86gl_glReadPixels(
            32, 32, 1, 1, GL_BGRA,
            GL_UNSIGNED_INT_8_8_8_8_REV, packedBgraPtr)) {
        throw new Error("WineD3D packed-layout BGRA readback failed");
    }
    const packedBgra = Array.from(
        module.HEAPU8.subarray(packedBgraPtr, packedBgraPtr + 32));
    for (let byte = 0; byte < packedBgra.length; byte++) {
        if (byte >= 16 && byte < 20) continue;
        if (packedBgra[byte] !== 0xA5) {
            throw new Error(`PACK sentinel changed at ${byte}`);
        }
    }
    if (packedBgra[16] < 15 || packedBgra[16] > 45 ||
            packedBgra[17] < 45 || packedBgra[17] > 85 ||
            packedBgra[18] < 240 || packedBgra[19] < 240) {
        throw new Error(`packed-layout BGRA mismatch ${packedBgra.slice(16, 20).join(",")}`);
    }
    module._v86gl_glPixelStorei(GL_PACK_ROW_LENGTH, 0);
    module._v86gl_glPixelStorei(GL_PACK_SKIP_ROWS, 0);
    module._v86gl_glPixelStorei(GL_PACK_SKIP_PIXELS, 0);

    /* Exercise the same PACK math with two-byte pixels and an eight-byte row
     * alignment: row stride 8 + skipped pixel 2 = output offsets 10 and 18. */
    module._v86gl_glPixelStorei(GL_PACK_ALIGNMENT, 8);
    module._v86gl_glPixelStorei(GL_PACK_ROW_LENGTH, 3);
    module._v86gl_glPixelStorei(GL_PACK_SKIP_ROWS, 1);
    module._v86gl_glPixelStorei(GL_PACK_SKIP_PIXELS, 1);
    const packed565Ptr = module._malloc(24);
    module.HEAPU8.fill(0x5A, packed565Ptr, packed565Ptr + 24);
    if (!module._v86gl_glReadPixels(
            32, 31, 1, 2, GL_RGB,
            GL_UNSIGNED_SHORT_5_6_5_REV, packed565Ptr)) {
        throw new Error("packed-layout RGB/565_REV readback failed");
    }
    const packed565 = Array.from(
        module.HEAPU8.subarray(packed565Ptr, packed565Ptr + 24));
    for (let byte = 0; byte < packed565.length; byte++) {
        if ((byte >= 10 && byte < 12) ||
                (byte >= 18 && byte < 20)) continue;
        if (packed565[byte] !== 0x5A) {
            throw new Error(`565 PACK sentinel changed at ${byte}`);
        }
    }
    const packed565Value = new DataView(module.HEAPU8.buffer)
        .getUint16(packed565Ptr + 10, true);
    assertPackedColor("packed-layout RGB/565_REV", [
        packed565Value & 0x1f,
        (packed565Value >> 5) & 0x3f,
        (packed565Value >> 11) & 0x1f,
        1,
    ], [31, 63, 31, 1]);
    const packed565SecondRow = new DataView(module.HEAPU8.buffer)
        .getUint16(packed565Ptr + 18, true);
    if (packed565SecondRow !== packed565Value) {
        throw new Error(`565 PACK row mismatch ` +
            `${packed565Value.toString(16)}/${packed565SecondRow.toString(16)}`);
    }
    module._v86gl_glPixelStorei(GL_PACK_ALIGNMENT, 4);
    module._v86gl_glPixelStorei(GL_PACK_ROW_LENGTH, 0);
    module._v86gl_glPixelStorei(GL_PACK_SKIP_ROWS, 0);
    module._v86gl_glPixelStorei(GL_PACK_SKIP_PIXELS, 0);

    /* Reproduce WineD3D 1.7.52 draw_test_quad(): the attached texture stays
     * bound, but the explicit GLSL program has no sampler. Five consecutive
     * draws match the count seen in the original failing capability probe and
     * must not trigger WebGL's framebuffer feedback-loop validation. */
    const vertexShader = 71;
    const fragmentShader = 72;
    const program = 73;
    compileShader(vertexShader, GL_VERTEX_SHADER,
        "#version 120\nattribute vec4 pos;\nattribute vec4 color;\n" +
        "varying vec4 out_color;\nvoid main() {\n" +
        "  gl_Position = pos; out_color = color;\n}\n");
    compileShader(fragmentShader, GL_FRAGMENT_SHADER,
        "#version 120\nvarying vec4 out_color;\n" +
        "void main() { gl_FragData[0] = out_color; }\n");
    module._v86gl_glCreateProgramMapped(program);
    module._v86gl_glAttachShaderMapped(program, vertexShader);
    module._v86gl_glAttachShaderMapped(program, fragmentShader);
    for (const [index, name] of [[0, "pos"], [1, "color"]]) {
        const encoded = allocText(name);
        module._v86gl_glBindAttribLocationMapped(
            program, index, encoded.length, encoded.ptr);
    }
    module._v86gl_glLinkProgramMapped(program);
    if (!queryObject(OBJECT_PROGRAM, program, GL_LINK_STATUS)) {
        throw new Error("WineD3D probe program did not link");
    }

    const quad = new Float32Array([
        -1, -1, 0, 1, -1, 0, -1, 1, 0, 1, 1, 0,
    ]);
    const quadPtr = module._malloc(quad.byteLength);
    new Float32Array(module.HEAPU8.buffer, quadPtr, quad.length).set(quad);
    const conventionalMetaPtr = module._malloc(12 * 4);
    new Int32Array(module.HEAPU8.buffer, conventionalMetaPtr, 12).fill(0);
    const genericMetaPtr = module._malloc(7 * 4);
    new Int32Array(module.HEAPU8.buffer, genericMetaPtr, 7).set([
        0, 0, 1, 3, GL_FLOAT, 0, quadPtr,
    ]);
    module._v86gl_glUseProgramMapped(program);
    module._v86gl_glVertexAttrib4fMapped(1, 0.15, 0.75, 0.35, 1);
    module._v86gl_glDisableVertexAttribArrayMapped(1);
    for (let draw = 0; draw < 5; draw++) {
        module._v86gl_glDrawArraysPackedGL2(
            GL_TRIANGLE_STRIP, 4, 0, GL_TEXTURE0, 0, 0,
            conventionalMetaPtr, 1, genericMetaPtr);
        assertNoError(`WineD3D no-sampler FBO draw ${draw}`);
    }
    module._v86gl_glFinish();
    const shaderPixelPtr = module._malloc(4);
    module._v86gl_glReadPixels(
        32, 32, 1, 1, GL_RGBA, GL_UNSIGNED_BYTE, shaderPixelPtr);
    const shaderPixel = Array.from(
        module.HEAPU8.subarray(shaderPixelPtr, shaderPixelPtr + 4));
    if (shaderPixel[0] < 20 || shaderPixel[0] > 60 ||
            shaderPixel[1] < 170 || shaderPixel[1] > 215 ||
            shaderPixel[2] < 65 || shaderPixel[2] > 115 ||
            shaderPixel[3] < 240) {
        throw new Error(`WineD3D shader pixel mismatch ${shaderPixel.join(",")}`);
    }
    module._v86gl_glUseProgramMapped(0);
    module._v86gl_glDeleteProgramMapped(program);
    module._v86gl_glDeleteShaderMapped(vertexShader);
    module._v86gl_glDeleteShaderMapped(fragmentShader);

    module._v86gl_glFramebufferTextureMapped(
        GL_FRAMEBUFFER, GL_COLOR_ATTACHMENT0, GL_TEXTURE_2D, 0, 0, 0);
    module._v86gl_glBindFramebufferMapped(GL_FRAMEBUFFER, 0);
    module._v86gl_glDeleteFramebuffersMapped(1, namePtr(42));
    module._v86gl_glDeleteTextures(1, namePtr(61));

    module._v86gl_glDeleteRenderbuffersMapped(1, namePtr(51));
    module._v86gl_glDeleteRenderbuffersMapped(1, namePtr(52));
    module._v86gl_glDeleteFramebuffersMapped(1, namePtr(41));

    document.title = "OpenGL FBO browser test: PASS";
    document.getElementById("result").textContent =
        `PASS max=${maxRenderbufferSize} rb=${pixel.join(",")} ` +
        `texture=${texturePixel.join(",")} bgra=${bgraPixel.join(",")} ` +
        `packed16=${[rgb565, rgb565Rev, rgba4444, rgba4444Rev,
            rgba5551, bgra1555Rev].map(value => value.toString(16)).join(",")} ` +
        `shader=${shaderPixel.join(",")} ` +
        `formats=${colorFormats.length}`;
})().catch(error => {
    document.title = "OpenGL FBO browser test: FAIL";
    document.getElementById("result").textContent = `FAIL ${error.stack || error}`;
    throw error;
});
</script>
