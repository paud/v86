<!doctype html>
<meta charset="utf-8">
<title>D3D9 legacy texture WebGPU validation</title>
<pre id="result">RUNNING</pre>
<script>
(async () => {
    "use strict";
    const result = document.getElementById("result");
    try {
        if (!navigator.gpu) throw new Error("WebGPU unavailable");
        const adapter = await navigator.gpu.requestAdapter();
        if (!adapter) throw new Error("No WebGPU adapter");
        const device = await adapter.requestDevice();
        device.pushErrorScope("validation");

        const signed = device.createTexture({
            size: [1, 1, 1],
            format: "rgba8snorm",
            usage: GPUTextureUsage.COPY_DST | GPUTextureUsage.COPY_SRC |
                GPUTextureUsage.TEXTURE_BINDING,
        });
        device.queue.writeTexture({ texture: signed },
            new Uint8Array([0x80, 0x7f, 0x7f, 0x7f]),
            { bytesPerRow: 4, rowsPerImage: 1 }, [1, 1, 1]);

        const mixed = device.createTexture({
            size: [1, 1, 1],
            format: "rgba16float",
            usage: GPUTextureUsage.COPY_DST | GPUTextureUsage.COPY_SRC |
                GPUTextureUsage.TEXTURE_BINDING |
                GPUTextureUsage.RENDER_ATTACHMENT,
        });
        device.queue.writeTexture({ texture: mixed },
            new Uint8Array([0x00, 0xbc, 0x00, 0x3c,
                0x00, 0x3c, 0x00, 0x3c]),
            { bytesPerRow: 8, rowsPerImage: 1 }, [1, 1, 1]);

        await device.queue.onSubmittedWorkDone();
        const validation = await device.popErrorScope();
        if (validation) throw validation;
        signed.destroy();
        mixed.destroy();
        result.textContent = "PASS rgba8snorm rgba16float";
        result.dataset.status = "pass";
    } catch (error) {
        result.textContent = "FAIL " +
            ((error && error.message) || String(error));
        result.dataset.status = "fail";
    }
})();
</script>
